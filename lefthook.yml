pre-commit:
  commands:
    bun-lock:
      glob: "{package.json,bun.lock,apps/*/package.json,packages/*/package.json}"
      run: bun run check:lock
      fail_text: "❌ bun.lock is out of sync. Run 'bun install' and recommit."

pre-push:
  commands:
    verify:
      run: bun run check:prepush
      fail_text: "❌ Pre-push checks failed. Fix bun lock, lint, typecheck, or build issues before pushing."
